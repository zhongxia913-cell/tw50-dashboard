name: daily-update

on:
  schedule:
    - cron: "0 11 * * 1-5"      # UTC 11:00 = 台灣時間 19:00，週一至週五
  workflow_dispatch:            # 允許手動觸發

permissions:                    # 【修正一】授予寫入權限，解決 403
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::tidyquant, any::dplyr, any::tidyr,
                    any::lubridate, any::rsconnect

      - name: 更新資料
        run: Rscript update_data.R

      - name: 提交新資料          # 【修正二】僅在有變更時才 commit 與 push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add stock_daily.rds
          if git diff --staged --quiet; then
            echo "無新資料，跳過提交與推送。"
          else
            git commit -m "daily data update $(date +%F)"
            git push
          fi

      - name: 部署到 shinyapps.io
        env:
          ACC: ${{ secrets.SHINYAPPS_ACCOUNT }}
          TOK: ${{ secrets.SHINYAPPS_TOKEN }}
          SEC: ${{ secrets.SHINYAPPS_SECRET }}
        run: >
          Rscript -e "rsconnect::setAccountInfo(Sys.getenv('ACC'),
          Sys.getenv('TOK'), Sys.getenv('SEC'));
          rsconnect::deployApp('.', appName='tw50-dashboard', forceUpdate=TRUE)"
