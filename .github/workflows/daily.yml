name: daily-update

on:
  schedule:
    - cron: "0 11 * * 1-5"      # UTC 11:00 = 台灣時間 19:00，週一至週五
  workflow_dispatch:            # 允許手動觸發

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: false

      - name: 設定 CRAN 鏡像（名稱與網址一致）
        run: |
          RPROFILE=$(Rscript -e 'cat(file.path(R.home("etc"), "Rprofile.site"))')
          echo 'options(repos = c("https://cloud.r-project.org" = "https://cloud.r-project.org"))' | sudo tee -a "$RPROFILE"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::shiny, any::shinydashboard, any::plotly, any::DT,
                    any::tidyquant, any::dplyr, any::tidyr, any::lubridate,
                    any::rsconnect, any::BH, any::cpp11, any::progress,
                    any::RcppArmadillo

      - name: 更新資料
        run: Rscript update_data.R

      - name: 提交新資料
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull --rebase origin main
          git add stock_daily.rds
          if git diff --staged --quiet; then
            echo "無新資料，跳過提交與推送。"
          else
            git commit -m "daily data update $(date +%F)"
            git push
          fi

      - name: 部署到 shinyapps.io
        env:
          ACC: ${{ secrets.SHINYAPPS_ACCOUNT }}
          TOK: ${{ secrets.SHINYAPPS_TOKEN }}
          SEC: ${{ secrets.SHINYAPPS_SECRET }}
        run: >
          Rscript -e "options(repos = c('https://cloud.r-project.org' = 'https://cloud.r-project.org'));
          rsconnect::setAccountInfo(Sys.getenv('ACC'),
          Sys.getenv('TOK'), Sys.getenv('SEC'));
          rsconnect::deployApp('.', appFiles = c('app.R', 'stock_daily.rds'),
          appName='tw50-dashboard', forceUpdate=TRUE)"
